name: Feature request
description: Suggest a focused BugSwatter improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation before proposing an implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful behavior and any compatibility or safety tradeoffs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds that are already possible through configuration or existing tools
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundary
      options:
        - label: This proposal does not require giving a model shell, Git, MCP, write, or general filesystem access
          required: true
